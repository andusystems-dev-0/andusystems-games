# Prod save-api. Namespace auto-created by ArgoCD (CreateNamespace=true). The games-registry
# ConfigMap is generated from games-registry.yaml + products.yaml (see kustomization.yaml).
# DATABASE_URL comes from the CNPG-managed games-db-app Secret (regenerated on every rebuild, so
# it always matches the DB). JWT_SIGNING_KEY comes from the stable sealed save-api-jwt-prod Secret.
# Stripe keys are added (sealed) only when payments land — save-api boots without them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: save-api
  labels: { app: save-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: save-api }
  template:
    metadata:
      labels: { app: save-api }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532        # distroless "nonroot" UID — kubelet needs a numeric user to verify non-root
        seccompProfile: { type: RuntimeDefault }
      imagePullSecrets:
        - { name: forgejo-registry }
      containers:
        - name: save-api
          image: forgejo.andusystems.com/andusystems/games-save-api:latest # private Forgejo registry (in-cluster)
          ports:
            - containerPort: 8080
          env:
            - { name: ENV, value: "prod" }
            - { name: ADDR, value: ":8080" }
            - { name: REGISTRY_PATH, value: "/etc/games/games-registry.yaml" }
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: games-db-app, key: uri } } }
            - { name: JWT_SIGNING_KEY, valueFrom: { secretKeyRef: { name: save-api-jwt-prod, key: key } } }
          volumeMounts:
            - { name: registry, mountPath: /etc/games }
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: registry
          configMap: { name: games-registry }
---
apiVersion: v1
kind: Service
metadata:
  name: save-api
spec:
  selector: { app: save-api }
  ports:
    - { port: 80, targetPort: 8080 }
---
# Prod API is published publicly via the Cloudflare Tunnel → this Service. IngressRoute is the
# in-cluster route the tunnel targets.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: save-api
spec:
  entryPoints: [web]
  routes:
    - match: Host(`api.games.andusystems.com`)
      kind: Rule
      services:
        - { name: save-api, port: 80 }

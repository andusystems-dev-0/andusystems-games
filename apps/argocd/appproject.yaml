# The `games` AppProject in the mgmt ArgoCD hub. Applied by .github/workflows/deploy.yml.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: games
  namespace: argocd
spec:
  description: andusystems games estate (spoke cluster on VLAN 70)
  sourceRepos:
    - https://github.com/andusystems-dev-0/andusystems-games
    - https://charts.jetstack.io                     # cert-manager Helm chart (games-cert-manager)
    - https://bitnami.github.io/sealed-secrets        # sealed-secrets controller (games-sealed-secrets)
    - https://cloudnative-pg.github.io/charts         # CNPG operator (games-cnpg-operator)
    - https://kyverno.github.io/kyverno               # Kyverno (games-kyverno)
  destinations:
    - name: games
      namespace: '*'
  clusterResourceWhitelist:
    - { group: '*', kind: '*' }
  namespaceResourceWhitelist:
    - { group: '*', kind: '*' }

# One ArgoCD Application per app, reconciled by the mgmt hub onto the games spoke (cluster name: games).
# Applied by deploy.yml after the cluster is registered. Adding a platform app = one entry here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: games-cnpg
  namespace: argocd
spec:
  project: games
  source: { repoURL: https://github.com/andusystems-dev-0/andusystems-games, targetRevision: main, path: apps/cnpg }
  destination: { name: games, namespace: save-api }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true"]
---

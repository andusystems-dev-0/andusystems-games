# One ArgoCD Application per app, reconciled by the mgmt hub onto the games spoke (cluster name: games).
# Applied by deploy.yml after the cluster is registered. Adding a platform app = one entry here.
#
# Cluster-add-ons that used to be installed by hand (sealed-secrets, CNPG operator, Kyverno) are now
# ArgoCD apps too, so a from-scratch redeploy recreates them. Early sync-waves order the foundation:
#   -50 sealed-secrets (its CRD must exist before ANY committed SealedSecret syncs)
#   -40 cert-manager · -30 cnpg-operator + tls · -20 kyverno · 0 clusters/apps · 5 kyverno-policies
# NOTE: unlike the mgmt cluster, games has NO Prometheus operator (metrics go via grafana-agent
# remote_write), so none of these enable ServiceMonitor/PodMonitor — those CRDs don't exist here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: games-sealed-secrets
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "-50" }
spec:
  project: games
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.16.2
    helm:
      values: |
        # fullnameOverride pins the controller Service name to `sealed-secrets-controller`, which the
        # kubeseal CLI expects by default. The master key the controller adopts on start is persisted
        # to S3 + re-seeded on rebuild (scripts/sealed-secrets-key.sh) so committed SealedSecrets stay
        # decryptable across a destroy+recreate — the #1 redeploy-reproducibility guarantee.
        fullnameOverride: sealed-secrets-controller
        # No public registries: pull the controller from the private Forgejo mirror (mirror-images.txt).
        image:
          registry: forgejo.andusystems.com
          repository: andusystems/mirror/bitnami/sealed-secrets-controller
          tag: "0.27.1"
  destination: { name: games, namespace: sealed-secrets }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true", "ServerSideApply=true"]
---
# CNPG operator (Helm). Was installed imperatively; now GitOps so a rebuild recreates it BEFORE the
# games-db / games-db-uat / forge-db Clusters (wave 0) need its CRDs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: games-cnpg-operator
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "-30" }
spec:
  project: games
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.22.1
    helm:
      values: |
        # No public registries: operator + operand both pull from the private Forgejo mirror.
        image:
          repository: forgejo.andusystems.com/andusystems/mirror/cloudnative-pg/cloudnative-pg
          tag: "1.24.1"
        # Default operand image. The games DBs were created on PG16 and their S3 backups are PG16 data,
        # so the estate is pinned to 16 (the clusters ALSO pin spec.imageName=16 — recovery with a PG17
        # binary fails "data directory initialized by PostgreSQL version 16, not compatible"). MUST be the
        # -system- flavor: CNPG dropped barman-cloud from the standard/minimal images, which silently
        # breaks WAL archiving + ALL S3 backups. (A PG16->17 major upgrade is a separate deliberate op.)
        config:
          create: true
          data:
            POSTGRES_IMAGE_NAME: forgejo.andusystems.com/andusystems/mirror/cloudnative-pg/postgresql:16-system-bookworm
  destination: { name: games, namespace: cnpg-system }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true", "ServerSideApply=true"]
---
# Kyverno (Helm) — estate baseline admission control. Slimmed vs the mgmt install: no ServiceMonitor
# (no Prometheus operator here) and no shipyard-* priorityClasses (they don't exist on this cluster).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: games-kyverno
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "-20" }
spec:
  project: games
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.3.4
    helm:
      values: |
        # No public registries: every Kyverno image (5 controllers, the kyvernopre init, the crds
        # migration kyverno-cli hook, and the kubectl cleanup hooks) pulls from the private Forgejo
        # mirror. global.image.registry sets the default host; each component ALSO pins registry
        # explicitly because the chart's per-component defaultRegistry=ghcr.io otherwise wins.
        # (All image refs validated with `helm template` before commit — busybox is only in helm-test
        # hooks, which ArgoCD skips, so it is intentionally not repointed.)
        global:
          image:
            registry: forgejo.andusystems.com
        crds:
          migration:
            image: { registry: forgejo.andusystems.com, repository: andusystems/mirror/kyverno/kyverno-cli, tag: v1.13.4 }
        # Admission webhook is on the Pod-create request path — 2 replicas spread across nodes so a
        # single node loss doesn't fail every Pod create. Modest resources for a 3-node games cluster.
        admissionController:
          replicas: 2
          podDisruptionBudget: { enabled: true, minAvailable: 1 }
          container:
            image: { registry: forgejo.andusystems.com, repository: andusystems/mirror/kyverno/kyverno, tag: v1.13.4 }
          initContainer:
            image: { registry: forgejo.andusystems.com, repository: andusystems/mirror/kyverno/kyvernopre, tag: v1.13.4 }
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/component: admission-controller
                  app.kubernetes.io/instance: kyverno
        backgroundController:
          replicas: 1
          image: { registry: forgejo.andusystems.com, repository: andusystems/mirror/kyverno/background-controller, tag: v1.13.4 }
        cleanupController:
          replicas: 1
          image: { registry: forgejo.andusystems.com, repository: andusystems/mirror/kyverno/cleanup-controller, tag: v1.13.4 }
        reportsController:
          replicas: 1
          image: { registry: forgejo.andusystems.com, repository: andusystems/mirror/kyverno/reports-controller, tag: v1.13.4 }
        # Extend the admission timeout so a slow node doesn't fail every Pod create (chart's knob).
        config: { webhookTimeoutSeconds: 20 }
        # Cleanup hooks: Bitnami REMOVED docker.io/bitnami/kubectl in 2025; use the relocated
        # bitnamilegacy image, mirrored into Forgejo so nothing pulls public.
        webhooksCleanup:
          image: { registry: forgejo.andusystems.com, repository: andusystems/mirror/bitnamilegacy/kubectl, tag: '1.30.2' }
        policyReportsCleanup:
          image: { registry: forgejo.andusystems.com, repository: andusystems/mirror/bitnamilegacy/kubectl, tag: '1.30.2' }
  destination: { name: games, namespace: kyverno }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true", "ServerSideApply=true"]
---
# Games Kyverno baseline (runAsNonRoot + drop-ALL + no-privileged + no-default-ns). Enforced on app
# namespaces; infra namespaces excluded. Synced AFTER kyverno (wave 5). Kyverno rewrites some spec
# fields server-side once it admits each policy -> ignoreDifferences keeps the app from perma-OutOfSync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: games-kyverno-policies
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "5" }
spec:
  project: games
  source:
    repoURL: https://github.com/andusystems-dev-0/andusystems-games
    targetRevision: main
    path: apps/kyverno-policies
    directory: { recurse: false, include: '{baseline,registry}.yml' }
  destination: { name: games, namespace: kyverno }
  ignoreDifferences:
    # Kyverno populates these server-side on admit (verified: admission/background/emitWarning/status);
    # validationFailureAction is NOT rewritten (it stays as git sets it), so it is GitOps-managed — a
    # committed Audit->Enforce flip must actually reconcile, so it is deliberately NOT ignored here.
    - group: kyverno.io
      kind: ClusterPolicy
      jsonPointers:
        - /spec/admission
        - /spec/background
        - /spec/emitWarning
        - /status
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
---

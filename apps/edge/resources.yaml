# Newt connector — dials out to Pangolin so the private resources (spriteforge, uat.*, uat-api)
# resolve to this cluster's Traefik. Creds come from sealed-newt-creds.yaml (SealedSecret -> newt-creds).
#
# Cloudflare Tunnel (cloudflared, for the PUBLIC prod save-api) is DEFERRED until a real
# CF tunnel token exists — re-add its Secret+Deployment here (sealed) when that's provisioned.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: newt
  labels: { app: newt }
spec:
  replicas: 1
  selector: { matchLabels: { app: newt } }
  template:
    metadata: { labels: { app: newt } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: newt
          image: forgejo.andusystems.com/andusystems/mirror/fosrl/newt:latest
          env:
            - { name: PANGOLIN_ENDPOINT, valueFrom: { secretKeyRef: { name: newt-creds, key: PANGOLIN_ENDPOINT } } }
            - { name: NEWT_ID, valueFrom: { secretKeyRef: { name: newt-creds, key: NEWT_ID } } }
            - { name: NEWT_SECRET, valueFrom: { secretKeyRef: { name: newt-creds, key: NEWT_SECRET } } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }

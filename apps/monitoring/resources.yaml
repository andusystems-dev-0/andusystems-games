# grafana-agent → remote_write to the mgmt Prometheus (andusystems-monitoring). One pane of glass in
# the mgmt Grafana. The mgmt kube-prometheus-stack runs enableRemoteWriteReceiver, exposed cross-VLAN
# on the xcluster-gateway MetalLB IP (mgmt VLAN, reachable from games VLAN 70 via inter-VLAN routing);
# no auth / no tenant header (open on the internal LAN, same as the apps-host OTel collector). Path is
# Prometheus remote-write (/api/v1/write), NOT Mimir (/api/v1/push). external_labels stamp cluster=games
# so mgmt Grafana can filter games metrics.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-agent
data:
  agent.yaml: |
    server:
      log_level: warn
    metrics:
      wal_directory: /data          # writable emptyDir — /etc/agent is a read-only configMap mount
      global:
        external_labels:
          cluster: games
        remote_write:
          - url: http://10.238.10.63:9090/api/v1/write   # mgmt Prometheus remote-write receiver (xcluster-gateway LB)
      configs:
        - name: games
          scrape_configs:
            # The core deliverable: save-api prod (ns save-api) + UAT (ns save-api-uat) /metrics on :8080.
            # Both Deployments share label app=save-api; the namespace label distinguishes them in Grafana.
            - job_name: save-api
              kubernetes_sd_configs: [{ role: pod }]
              relabel_configs:
                - { source_labels: [__meta_kubernetes_pod_label_app], regex: save-api, action: keep }
                - { source_labels: [__meta_kubernetes_pod_container_port_number], regex: "8080", action: keep }
                - { source_labels: [__meta_kubernetes_namespace], target_label: namespace }
                - { source_labels: [__meta_kubernetes_pod_name], target_label: pod }
            # Generic annotation-based discovery for everything else that opts in (prometheus.io/scrape),
            # so future services (spriteforge, etc.) are picked up without editing this config.
            - job_name: kubernetes-pods
              kubernetes_sd_configs: [{ role: pod }]
              relabel_configs:
                - { source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], regex: "true", action: keep }
                - { source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path], target_label: __metrics_path__, regex: (.+) }
                - { source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port], regex: "([^:]+)(?::\\d+)?;(\\d+)", replacement: "$1:$2", target_label: __address__ }
                - { source_labels: [__meta_kubernetes_namespace], target_label: namespace }
                - { source_labels: [__meta_kubernetes_pod_name], target_label: pod }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-agent
  labels: { app: grafana-agent }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana-agent } }
  template:
    metadata: { labels: { app: grafana-agent } }
    spec:
      serviceAccountName: grafana-agent   # needs pod/node/service list+watch for kubernetes_sd, else 0 targets
      securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: agent
          image: grafana/agent:v0.44.2
          # The agent.yaml is static-format, so force static mode (v0.44 defaults to flow, where
          # -config.file is ignored → "flag required"). WAL → /data, seed/temp → /tmp; both must be
          # writable emptyDirs under the read-only root.
          env:
            - { name: AGENT_MODE, value: static }
          args: ["-config.file=/etc/agent/agent.yaml", "-server.http.address=0.0.0.0:12345"]
          volumeMounts:
            - { name: config, mountPath: /etc/agent }
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: config
          configMap: { name: grafana-agent }
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
# RBAC so kubernetes_sd can discover scrape targets. Without this the agent runs as the default SA,
# can't list pods, finds 0 targets, and remote_write ships nothing (endpoint was fine, targets weren't).
apiVersion: v1
kind: ServiceAccount
metadata: { name: grafana-agent }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: grafana-agent }
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, nodes/metrics, services, endpoints, pods]
    verbs: [get, list, watch]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: grafana-agent }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: grafana-agent }
subjects:
  - { kind: ServiceAccount, name: grafana-agent, namespace: monitoring }

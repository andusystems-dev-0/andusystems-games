# grafana-agent → remote_write to the mgmt LGTM (andusystems-monitoring). One pane of glass in the
# mgmt Grafana. Endpoint is a PLACEHOLDER until wired.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-agent
data:
  agent.yaml: |
    server:
      log_level: warn
    metrics:
      wal_directory: /data          # writable emptyDir — /etc/agent is a read-only configMap mount
      global:
        remote_write:
          - url: https://REPLACE_ME-mimir.andusystems.com/api/v1/push
      configs:
        - name: games
          scrape_configs:
            - job_name: save-api
              kubernetes_sd_configs: [{ role: pod }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-agent
  labels: { app: grafana-agent }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana-agent } }
  template:
    metadata: { labels: { app: grafana-agent } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: agent
          image: grafana/agent:v0.44.2
          # Static mode: -config.file (the agent.yaml is static-format). The flow-mode `run`
          # subcommand errored with "-config.file flag required" + can't write its WAL under a
          # read-only root, so it crash-looped.
          args: ["-config.file=/etc/agent/agent.yaml", "-server.http.address=0.0.0.0:12345"]
          volumeMounts:
            - { name: config, mountPath: /etc/agent }
            - { name: data, mountPath: /data }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: config
          configMap: { name: grafana-agent }
        - name: data
          emptyDir: {}

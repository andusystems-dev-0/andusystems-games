# Let's Encrypt DNS-01 (Cloudflare) issuer — mirrors the mgmt/platform cluster.
# The cloudflare-api-token Secret is a SealedSecret in the cert-manager namespace.
# SkipDryRunOnMissingResource lets ArgoCD apply this before the cert-manager CRDs land.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: alex@andusystems.com
    privateKeySecretRef: { name: letsencrypt-account }
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef: { name: cloudflare-api-token, key: api-token }

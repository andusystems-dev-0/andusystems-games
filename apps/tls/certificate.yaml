# Games-edge cert served by the games k3s Traefik (which runs in kube-system).
# Covers the hosts Pangolin TCP-passes through to this cluster's Traefik on :443:
#   - spriteforge.andusystems.com  (specific name — NOT *.andusystems.com, which the mgmt
#     cluster's cert-manager already owns; two issuers sharing _acme-challenge.andusystems.com
#     race and stall, so we use the unique _acme-challenge.spriteforge.andusystems.com)
#   - *.games.andusystems.com      (uat-api + single-label games hosts; unique challenge record)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: games-edge
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: games-edge-tls
  issuerRef: { name: letsencrypt, kind: ClusterIssuer }
  dnsNames:
    - spriteforge.andusystems.com
    - "*.games.andusystems.com"

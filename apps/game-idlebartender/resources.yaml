# idlebartender — the game's public web bundle, hosted on YOUR games cluster (not Cloudflare Pages).
# A private nginx image (built by the game repo's image.yml → Forgejo) baked with the Phaser bundle.
# Exposed via a Pangolin resource (TCP-passes :443 to this cluster's Traefik) with Cloudflare in front
# as DNS/CDN only. Kyverno-compliant: non-root uid 101, read-only rootfs, drop-ALL, Forgejo image.
apiVersion: v1
kind: Namespace
metadata: { name: games-web }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idlebartender
  namespace: games-web
  labels: { app: idlebartender }
spec:
  replicas: 2
  selector: { matchLabels: { app: idlebartender } }
  template:
    metadata: { labels: { app: idlebartender } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 101, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          # Pinned to the build SHA so ArgoCD rolls new builds (bump on each release, like spriteforge).
          image: forgejo.andusystems.com/andusystems/game-idlebartender:232f45b89e1893115460a4f445a140503f7fd853
          ports: [{ containerPort: 8080 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          # nginx-unprivileged needs writable temp/cache under the read-only root.
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
          readinessProbe: { httpGet: { path: /, port: 8080 } }
          livenessProbe: { httpGet: { path: /, port: 8080 } }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 96Mi }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: cache, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: idlebartender, namespace: games-web }
spec:
  selector: { app: idlebartender }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: { name: idlebartender, namespace: games-web }
spec:
  # Public game. A Pangolin resource TCP-passes :443 here; Cloudflare proxies idlebartender.com (CDN).
  # tls: {} terminates with the default games-edge-tls store cert — Cloudflare "Full" SSL accepts it.
  entryPoints: [web, websecure]
  routes:
    - match: Host(`idlebartender.com`)
      kind: Rule
      services:
        - { name: idlebartender, port: 80 }
  tls: {}

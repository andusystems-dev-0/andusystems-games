# Registry policy: every workload image must come from the private Forgejo registry. This makes the
# "no public images" rule self-enforcing (docs/registry-audit.md). Starts in Audit — it REPORTS every
# non-Forgejo image via PolicyReports (a continuous compliance audit) without blocking — and flips to
# Enforce once the registry migration (mirror + repoints, Stages 1-4) lands.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: images-from-forgejo-only
spec:
  validationFailureAction: Audit   # TODO(stage5): flip to Enforce after the migration completes
  background: true
  rules:
    - name: only-forgejo-registry
      match: { any: [{ resources: { kinds: ["Pod"] } }] }
      exclude:
        any:
          # k3s-bundled + metallb pull public images until Stage 4 (k3s --system-default-registry +
          # containerd mirror). Excluded so a future Enforce flip doesn't brick the control plane.
          - resources: { namespaces: ["kube-system", "metallb-system"] }
      validate:
        message: "image must come from the private Forgejo registry (forgejo.andusystems.com/*)"
        pattern:
          spec:
            =(initContainers):
              - image: "forgejo.andusystems.com/*"
            =(ephemeralContainers):
              - image: "forgejo.andusystems.com/*"
            containers:
              - image: "forgejo.andusystems.com/*"

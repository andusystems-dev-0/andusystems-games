# SpriteForge studio — private (Pangolin only). Backend + its own CNPG db.
# Secrets come from sealed-spriteforge-secrets.yaml + sealed-forge-db-owner.yaml (SealedSecrets).
# FAL_KEY + R2_* are sealed placeholders until real keys are provided (asset generation needs fal.ai).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forge-db
  annotations: {cnpg.io/skipEmptyWalArchiveCheck: "true"}
spec:
  instances: 2
  storage: {size: 5Gi}
  env:
    - {name: AWS_REGION, value: "us-east-1"}
  bootstrap:
    recovery:
      source: fromS3
  backup:
    retentionPolicy: "14d"
    barmanObjectStore:
      destinationPath: s3://andusystems-dr/cnpg/forge-db
      serverName: forge-db-g3
      s3Credentials:
        accessKeyId: {name: cnpg-backup-creds, key: ACCESS_KEY_ID}
        secretAccessKey: {name: cnpg-backup-creds, key: SECRET_ACCESS_KEY}
      wal: {compression: gzip, encryption: AES256}
      data: {compression: gzip, encryption: AES256}
  externalClusters:
    - name: fromS3
      barmanObjectStore:
        destinationPath: s3://andusystems-dr/cnpg/forge-db
        serverName: forge-db-g2
        s3Credentials:
          accessKeyId:
            name: cnpg-backup-creds
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: cnpg-backup-creds
            key: SECRET_ACCESS_KEY
        wal:
          compression: gzip
          encryption: AES256
        data:
          compression: gzip
          encryption: AES256
  imageName: forgejo.andusystems.com/andusystems/mirror/cloudnative-pg/postgresql:16-system-bookworm
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata: {name: forge-db-nightly, namespace: spriteforge}
spec:
  schedule: "0 45 3 * * *"
  backupOwnerReference: self
  cluster: {name: forge-db}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spriteforge
  labels: {app: spriteforge}
spec:
  replicas: 1
  selector: {matchLabels: {app: spriteforge}}
  template:
    metadata: {labels: {app: spriteforge}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      imagePullSecrets:
        - {name: forgejo-registry}
      containers:
        - name: backend
          # Pinned to the immutable build SHA so ArgoCD detects the change and rolls it (a re-pushed
          # :latest is the same tag → no rollout). Bump this to the new SHA on each spriteforge release.
          # a209b07 = serve assets by streaming + fal data URIs (SDK presign 403'd). Library view + per-asset
          # remove-bg now work. (ea94b41 = library view/remove-bg; d48060c = Remove BG page; 11dfdda = fal fix.)
          image: forgejo.andusystems.com/andusystems/spriteforge:a209b07d121632763f48141e7f2143d9c505d0dc
          ports: [{containerPort: 8090}]
          env:
            - {name: ADDR, value: ":8090"}
            - {name: ENV, value: "prod"}
            - {name: AWS_REGION, value: "us-east-1"} # asset store = AWS S3 (endpoint empty); region for the S3 client
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: forge-db-app, key: uri}}}
            # Asset store = AWS S3 (bucket andusystems-spriteforge, private, served via presigned URLs).
            # Reuse the platform/games AWS keys already in this namespace as cnpg-backup-creds (the same
            # creds forge-db uses for its S3 backups) — no separate sealed secret needed. R2_ENDPOINT is
            # left unset so the S3 client talks to real AWS (endpoint empty => AWS, not R2/MinIO).
            - {name: R2_BUCKET, value: "andusystems-spriteforge"}
            - {name: R2_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: cnpg-backup-creds, key: ACCESS_KEY_ID}}}
            - {name: R2_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: cnpg-backup-creds, key: SECRET_ACCESS_KEY}}}
          # FAL_KEY lands here (sealed). Optional so the service still boots if it's absent; the backend
          # upgrades from noop to the real fal provider automatically when the key appears.
          envFrom:
            - secretRef: {name: spriteforge-secrets, optional: true}
          readinessProbe: {httpGet: {path: /readyz, port: 8090}}
          livenessProbe: {httpGet: {path: /healthz, port: 8090}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: spriteforge
spec:
  selector: {app: spriteforge}
  ports: [{port: 80, targetPort: 8090}]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: spriteforge
spec:
  # Pangolin TCP-passes both :80 and :443 through to this Traefik, so serve on both.
  # tls: {} serves the default TLSStore cert (games-edge-tls, Let's Encrypt) on websecure.
  entryPoints: [web, websecure]
  routes:
    - match: Host(`spriteforge.andusystems.com`) # reached only via the Pangolin private resource
      kind: Rule
      services:
        - {name: spriteforge, port: 80}
  tls: {}

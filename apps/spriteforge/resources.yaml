# SpriteForge studio — private (Pangolin only). Backend + its own CNPG db.
# Secrets come from sealed-spriteforge-secrets.yaml + sealed-forge-db-owner.yaml (SealedSecrets).
# FAL_KEY + R2_* are sealed placeholders until real keys are provided (asset generation needs fal.ai).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forge-db
spec:
  instances: 2
  storage: { size: 5Gi }
  bootstrap:
    initdb:
      database: forge
      owner: forge
      secret: { name: forge-db-owner }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spriteforge
  labels: { app: spriteforge }
spec:
  replicas: 1
  selector: { matchLabels: { app: spriteforge } }
  template:
    metadata: { labels: { app: spriteforge } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
      imagePullSecrets:
        - { name: forgejo-registry }
      containers:
        - name: backend
          image: forgejo.andusystems.com/andusystems/spriteforge:latest
          ports: [ { containerPort: 8090 } ]
          env:
            - { name: ADDR, value: ":8090" }
            - { name: ENV, value: "prod" }
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: forge-db-app, key: uri } } }
          # FAL_KEY + R2_* land here once provided; optional so the service boots on the noop provider first.
          envFrom:
            - secretRef: { name: spriteforge-secrets, optional: true }
          readinessProbe: { httpGet: { path: /readyz, port: 8090 } }
          livenessProbe: { httpGet: { path: /healthz, port: 8090 } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: spriteforge
spec:
  selector: { app: spriteforge }
  ports: [ { port: 80, targetPort: 8090 } ]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: spriteforge
spec:
  entryPoints: [web]
  routes:
    - match: Host(`spriteforge.andusystems.com`)   # reached only via the Pangolin private resource
      kind: Rule
      services:
        - { name: spriteforge, port: 80 }

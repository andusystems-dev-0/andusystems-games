# SpriteForge studio — private (Pangolin only). Backend + its own CNPG db. FAL_KEY placeholder until set.
apiVersion: v1
kind: Secret
metadata:
  name: spriteforge-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgres://forge:REPLACE_ME@forge-db-rw:5432/forge?sslmode=require"
  PROVIDER: "fal"
  FAL_KEY: "REPLACE_ME_FAL_KEY"
  R2_ENDPOINT: "https://REPLACE_ME.r2.cloudflarestorage.com"
  R2_ACCESS_KEY_ID: "REPLACE_ME"
  R2_SECRET_ACCESS_KEY: "REPLACE_ME"
  R2_BUCKET: "andusystems-spriteforge"
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forge-db
spec:
  instances: 2
  storage: { size: 5Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spriteforge
  labels: { app: spriteforge }
spec:
  replicas: 1
  selector: { matchLabels: { app: spriteforge } }
  template:
    metadata: { labels: { app: spriteforge } }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: backend
          image: ghcr.io/andusystems-dev-0/spriteforge:latest
          ports: [ { containerPort: 8090 } ]
          env:
            - { name: ADDR, value: ":8090" }
            - { name: ENV, value: "prod" }
          envFrom:
            - secretRef: { name: spriteforge-secrets }
          readinessProbe: { httpGet: { path: /readyz, port: 8090 } }
          livenessProbe: { httpGet: { path: /healthz, port: 8090 } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: spriteforge
spec:
  selector: { app: spriteforge }
  ports: [ { port: 80, targetPort: 8090 } ]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: spriteforge
spec:
  entryPoints: [web]
  routes:
    - match: Host(`spriteforge.andusystems.com`)   # reached only via the Pangolin private resource
      kind: Rule
      services:
        - { name: spriteforge, port: 80 }

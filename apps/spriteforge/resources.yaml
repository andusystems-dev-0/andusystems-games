# SpriteForge studio — private (Pangolin only). Backend + its own CNPG db.
# Secrets come from sealed-spriteforge-secrets.yaml + sealed-forge-db-owner.yaml (SealedSecrets).
# FAL_KEY + R2_* are sealed placeholders until real keys are provided (asset generation needs fal.ai).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forge-db
  annotations: {cnpg.io/skipEmptyWalArchiveCheck: "true"}
spec:
  instances: 2
  storage: {size: 5Gi}
  env:
    - {name: AWS_REGION, value: "us-east-1"}
  bootstrap:
    recovery:
      source: fromS3
  backup:
    retentionPolicy: "14d"
    barmanObjectStore:
      destinationPath: s3://andusystems-dr/cnpg/forge-db
      serverName: forge-db-g3
      s3Credentials:
        accessKeyId: {name: cnpg-backup-creds, key: ACCESS_KEY_ID}
        secretAccessKey: {name: cnpg-backup-creds, key: SECRET_ACCESS_KEY}
      wal: {compression: gzip, encryption: AES256}
      data: {compression: gzip, encryption: AES256}
  externalClusters:
    - name: fromS3
      barmanObjectStore:
        destinationPath: s3://andusystems-dr/cnpg/forge-db
        serverName: forge-db-g2
        s3Credentials:
          accessKeyId:
            name: cnpg-backup-creds
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: cnpg-backup-creds
            key: SECRET_ACCESS_KEY
        wal:
          compression: gzip
          encryption: AES256
        data:
          compression: gzip
          encryption: AES256
  imageName: forgejo.andusystems.com/andusystems/mirror/cloudnative-pg/postgresql:16-system-bookworm
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata: {name: forge-db-nightly, namespace: spriteforge}
spec:
  schedule: "0 45 3 * * *"
  backupOwnerReference: self
  cluster: {name: forge-db}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spriteforge
  labels: {app: spriteforge}
spec:
  replicas: 1
  selector: {matchLabels: {app: spriteforge}}
  template:
    metadata: {labels: {app: spriteforge}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      imagePullSecrets:
        - {name: forgejo-registry}
      containers:
        - name: backend
          # Pinned to the immutable build SHA so ArgoCD detects the change and rolls it (a re-pushed
          # :latest is the same tag → no rollout). Bump this to the new SHA on each spriteforge release.
          # 9b4b55d = background removal for item sprites (fal BiRefNet v2) + removeBackground toggle.
          # (prev 11dfdda = fal endpoint fix flux-schnell 404 → fal-ai/flux/schnell + SAM2 response shape.)
          image: forgejo.andusystems.com/andusystems/spriteforge:9b4b55d603fa8b2ee225754b6cd3a27d67ebfc37
          ports: [{containerPort: 8090}]
          env:
            - {name: ADDR, value: ":8090"}
            - {name: ENV, value: "prod"}
            - {name: AWS_REGION, value: "us-east-1"} # asset store = AWS S3 (endpoint empty); region for the S3 client
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: forge-db-app, key: uri}}}
          # FAL_KEY + R2_ACCESS_KEY_ID/R2_SECRET_ACCESS_KEY (+ optional R2_ENDPOINT for R2, R2_BUCKET) land
          # here once provided. Optional so the service boots on the noop provider + noop store first; the
          # backend upgrades to the real S3 asset store automatically when the creds appear.
          envFrom:
            - secretRef: {name: spriteforge-secrets, optional: true}
          readinessProbe: {httpGet: {path: /readyz, port: 8090}}
          livenessProbe: {httpGet: {path: /healthz, port: 8090}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: spriteforge
spec:
  selector: {app: spriteforge}
  ports: [{port: 80, targetPort: 8090}]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: spriteforge
spec:
  # Pangolin TCP-passes both :80 and :443 through to this Traefik, so serve on both.
  # tls: {} serves the default TLSStore cert (games-edge-tls, Let's Encrypt) on websecure.
  entryPoints: [web, websecure]
  routes:
    - match: Host(`spriteforge.andusystems.com`) # reached only via the Pangolin private resource
      kind: Rule
      services:
        - {name: spriteforge, port: 80}
  tls: {}

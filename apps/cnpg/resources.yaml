# CloudNativePG clusters (operator = games-cnpg-operator Helm app, sync-wave -30). Durability = base
# backups + WAL to S3 (barman), same bucket + keys as the platform (s3://andusystems-dr/cnpg/<cluster>).
# Creds come from the sealed cnpg-backup-creds Secret
# (cluster-wide scope). endpointURL omitted → default AWS S3 endpoint; region via AWS_REGION env.
# Nightly ScheduledBackups take base backups; WAL archives continuously. See data-model.md.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: games-db
  namespace: save-api
  annotations: {cnpg.io/skipEmptyWalArchiveCheck: "true"}
spec:
  instances: 3
  storage:
    size: 10Gi
  env:
    - {name: AWS_REGION, value: "us-east-1"}
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://andusystems-dr/cnpg/games-db
      serverName: games-db-g2 # bump the generation on a destroy+rebuild so backups don't collide
      # endpointURL OMITTED -> default AWS S3 endpoint (region us-east-1 / AWS_REGION)
      s3Credentials:
        accessKeyId: {name: cnpg-backup-creds, key: ACCESS_KEY_ID}
        secretAccessKey: {name: cnpg-backup-creds, key: SECRET_ACCESS_KEY}
      wal: {compression: gzip, encryption: AES256}
      data: {compression: gzip, encryption: AES256}
  bootstrap:
    recovery:
      source: fromS3
  externalClusters:
    - name: fromS3
      barmanObjectStore:
        destinationPath: s3://andusystems-dr/cnpg/games-db
        serverName: games-db-g1
        s3Credentials:
          accessKeyId:
            name: cnpg-backup-creds
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: cnpg-backup-creds
            key: SECRET_ACCESS_KEY
        wal:
          compression: gzip
          encryption: AES256
        data:
          compression: gzip
          encryption: AES256
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata: {name: games-db-nightly, namespace: save-api}
spec:
  schedule: "0 30 3 * * *" # CNPG cron has a leading seconds field
  backupOwnerReference: self
  cluster: {name: games-db}
---

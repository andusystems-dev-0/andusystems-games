# games-redeploy — DESTROY + recreate the games cluster, then converge + re-register. Durability is
# off-cluster (S3). DBs are RESTORED on rebuild: before destroying, we rewrite apps/cnpg + apps/spriteforge
# so each Cluster bootstraps from its latest S3 barman generation and archives to a fresh one (CNPG won't
# archive to a non-empty serverName — validated by scripts/dr-drill.sh), and commit that so ArgoCD applies
# it (Option 1: self-committing redeploy). The persisted sealed-secrets master key is re-seeded first so
# the committed SealedSecrets stay decryptable. DESTROY-gated.
name: games-redeploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DESTROY to confirm a full destroy + recreate'
        required: true
        default: ''

permissions:
  contents: write   # self-commit the CNPG recovery spec (generation bump) before recreating

concurrency:
  group: games-deploy   # shares the deploy lock — never run both at once
  cancel-in-progress: false

jobs:
  redeploy:
    if: ${{ github.event.inputs.confirm == 'DESTROY' }}
    runs-on: [self-hosted, linux, andusystems-mgmt]
    timeout-minutes: 60
    env:
      SSH_KEY_PATH: /root/.ssh/andusystems-proxmox
      AWS_REGION: us-east-1
      TF_VAR_proxmox_endpoint: ${{ secrets.PROXMOX_ENDPOINT }}
      TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
      TF_VAR_ssh_public_keys: '["${{ secrets.SSH_PUBKEY }}"]'
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup tools (OpenTofu + Ansible + kubectl + aws + jq)
        run: |
          set -euo pipefail
          curl -fsSL https://get.opentofu.org/install-opentofu.sh -o /tmp/install-tofu.sh
          chmod +x /tmp/install-tofu.sh && /tmp/install-tofu.sh --install-method standalone
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq openssh-client python3 python3-pip unzip curl
          python3 -m pip install --quiet --break-system-packages 'ansible-core>=2.16,<2.22'
          if ! command -v kubectl >/dev/null; then
            curl -fsSLo /tmp/kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          fi
          if ! command -v aws >/dev/null; then
            curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscli.zip
            unzip -q /tmp/awscli.zip -d /tmp && sudo /tmp/aws/install --update
          fi

      - name: Provision Proxmox SSH key
        env:
          KEY_BODY: ${{ secrets.PROXMOX_SSH_KEY }}
          PUB_BODY: ${{ secrets.SSH_PUBKEY }}
        run: |
          set -euo pipefail
          mkdir -p /root/.ssh
          printf '%s\n' "$KEY_BODY" > "$SSH_KEY_PATH"; chmod 600 "$SSH_KEY_PATH"
          ssh-keygen -y -f "$SSH_KEY_PATH" >/dev/null || { echo "::error::PROXMOX_SSH_KEY invalid"; exit 1; }
          printf '%s\n' "$PUB_BODY" > "${SSH_KEY_PATH}.pub"

      # BEFORE destroying anything: point the Cluster specs at recovery from the latest S3 generation
      # (archiving to a fresh one) and commit, so the rebuilt clusters restore their data instead of
      # coming up empty. Runs first (S3-only, no cluster needed) — if it fails, nothing is destroyed yet.
      - name: Prepare CNPG recovery spec + self-commit
        run: |
          set -euo pipefail
          if ! command -v yq >/dev/null; then
            curl -fsSLo /tmp/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          fi
          scripts/cnpg-recovery-prepare.sh
          if git diff --quiet -- apps/cnpg/resources.yaml apps/spriteforge/resources.yaml; then
            echo "CNPG specs already point at the current recovery generation — nothing to commit"; exit 0
          fi
          git config user.name "games-bot"
          git config user.email "games-bot@andusystems.com"
          git add apps/cnpg/resources.yaml apps/spriteforge/resources.yaml
          git commit -m "redeploy: CNPG recover from S3 (generation bump) $(date -u +%FT%TZ)"
          git push origin HEAD:main

      - name: Tofu destroy + recreate
        working-directory: terraform
        run: |
          tofu init -input=false
          tofu destroy -auto-approve -input=false
          tofu apply -auto-approve -input=false

      # Fresh VMs need ~30-60s to boot sshd; ansible would otherwise fail with "connection refused".
      - name: Wait for SSH on the games nodes
        run: |
          set -euo pipefail
          for host in 10.238.70.41 10.238.70.42 10.238.70.43; do
            echo "waiting for ssh on $host..."
            for i in $(seq 1 60); do
              ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 \
                -i "$SSH_KEY_PATH" ubuntu@"$host" true 2>/dev/null && { echo "  $host up"; break; }
              [ "$i" = 60 ] && { echo "::error::$host SSH not up after 5min"; exit 1; }
              sleep 5
            done
          done

      - name: Ansible converge (k3s HA + MetalLB)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          FORGEJO_USER: ${{ secrets.FORGEJO_USER }}    # node-level private-registry auth (registries.yaml)
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: ansible-playbook -i inventory/games/hosts.yml k3s.yml

      - name: Fetch games kubeconfig
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$SSH_KEY_PATH" \
            ubuntu@10.238.70.41 'sudo cat /etc/rancher/k3s/k3s.yaml' > /tmp/games.kubeconfig
          sed -i 's#127.0.0.1#10.238.70.41#' /tmp/games.kubeconfig

      # A rebuilt cluster MUST re-seed the persisted sealed-secrets key BEFORE ArgoCD installs the
      # controller — otherwise a fresh key makes every committed SealedSecret undecryptable. Hard-fail
      # (--required) if S3 has no key: better to stop than to silently rebuild an unrecoverable cluster.
      - name: Restore sealed-secrets master key (REQUIRED)
        run: KUBECONFIG=/tmp/games.kubeconfig scripts/sealed-secrets-key.sh restore --required

      - name: Re-register games cluster + apps in ArgoCD (mgmt hub)
        env:
          # Fetch a FRESH mgmt kubeconfig from the live node — the mgmt CA rotates on redeploy and
          # its IP can drift, so a static MGMT_KUBECONFIG secret goes stale. Resilient across redeploys.
          MGMT_API_HOST: ${{ vars.MGMT_API_HOST || '10.238.10.42' }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$SSH_KEY_PATH" \
            ubuntu@"$MGMT_API_HOST" 'sudo cat /etc/rancher/k3s/k3s.yaml' > /tmp/mgmt.kubeconfig
          sed -i "s#https://127.0.0.1:6443#https://$MGMT_API_HOST:6443#" /tmp/mgmt.kubeconfig
          export KUBECONFIG=/tmp/mgmt.kubeconfig
          ca=$(grep 'certificate-authority-data:' /tmp/games.kubeconfig | awk '{print $2}')
          cert=$(grep 'client-certificate-data:' /tmp/games.kubeconfig | awk '{print $2}')
          key=$(grep 'client-key-data:' /tmp/games.kubeconfig | awk '{print $2}')
          config="{\"tlsClientConfig\":{\"insecure\":false,\"caData\":\"$ca\",\"certData\":\"$cert\",\"keyData\":\"$key\"}}"
          kubectl -n argocd create secret generic cluster-games \
            --from-literal=name=games \
            --from-literal=server=https://10.238.70.41:6443 \
            --from-literal=config="$config" \
            --dry-run=client -o yaml \
            | kubectl label --local -f - argocd.argoproj.io/secret-type=cluster -o yaml \
            | kubectl apply -f -
          kubectl apply -f apps/argocd/

      # After ArgoCD recreates + recovers the clusters, take an immediate base backup into the NEW
      # generation so it is independently recoverable before the nightly runs — otherwise a back-to-back
      # redeploy would fall back to the previous generation and lose the interim writes. Best-effort.
      - name: Seed base backup in the new generation
        continue-on-error: true
        run: |
          set -euo pipefail
          export KUBECONFIG=/tmp/games.kubeconfig
          for pair in "games-db save-api" "games-db-uat save-api-uat" "forge-db spriteforge"; do
            set -- $pair
            for _ in $(seq 1 60); do kubectl -n "$2" get cluster "$1" >/dev/null 2>&1 && break; sleep 15; done
            kubectl -n "$2" wait --for=condition=Ready cluster/"$1" --timeout=20m \
              || echo "::warning::$1 not Ready in time — run 'make backup' once it recovers"
          done
          scripts/cnpg-backup.sh || echo "::warning::seed backup failed — run 'make backup' after recovery"

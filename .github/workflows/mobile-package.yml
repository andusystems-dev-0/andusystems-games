name: mobile-package
# Reusable: package a game's web bundle into the shared offline Capacitor shell and ship to stores.
# Called by public andusystems-game-<slug> repos (public → public, no token friction). See
# docs/mobile-release.md. Signing secrets are provided by the caller via `secrets: inherit`.
on:
  workflow_call:
    inputs:
      web_artifact:
        description: name of the uploaded web bundle artifact (dist/)
        required: true
        type: string
      track:
        description: beta (TestFlight + Play internal = UAT) | release (App Store + Play prod)
        required: true
        type: string

jobs:
  android:
    runs-on: [self-hosted, linux, andusystems-mgmt]
    steps:
      - name: checkout game repo (for game.json)
        uses: actions/checkout@v4
        with: { path: game }
      - name: checkout shared shell
        uses: actions/checkout@v4
        with:
          repository: andusystems-dev-0/andusystems-games
          path: shellsrc
      - uses: actions/download-artifact@v4
        with: { name: "${{ inputs.web_artifact }}", path: shellsrc/mobile/shell/www }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: prepare + sync
        working-directory: shellsrc/mobile/shell
        run: |
          npm ci
          node scripts/prepare.mjs ../../../game/game.json
          npx cap add android || true
          npx cap sync android
      - name: build signed .aab
        working-directory: shellsrc/mobile/shell/android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # TODO(signing): cap sync regenerates android/ fresh, so decode ANDROID_KEYSTORE_B64 and inject a
        # signingConfig before bundleRelease (or use Play App Signing upload key) once the keystore exists.
        run: ./gradlew bundleRelease
      - name: setup ruby + fastlane
        uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.2', bundler-cache: true, working-directory: shellsrc/mobile/shell }
      - name: fastlane → Play (${{ inputs.track }})
        working-directory: shellsrc/mobile/shell
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          # track beta → Play internal testing (UAT); release → production (prod). Play App Signing owns the key.
          bundle exec fastlane android "$( [ '${{ inputs.track }}' = 'release' ] && echo release || echo beta )"

  ios:
    # CONFIRM: needs a macOS runner (estate has none today) — Mac mini self-hosted or hosted macOS.
    # Guard keeps Android shipping even while iOS is unresolved.
    if: ${{ vars.IOS_RUNNER != '' }}
    runs-on: ${{ vars.IOS_RUNNER }}
    steps:
      - uses: actions/checkout@v4
        with: { path: game }
      - uses: actions/checkout@v4
        with:
          repository: andusystems-dev-0/andusystems-games
          path: shellsrc
      - uses: actions/download-artifact@v4
        with: { name: "${{ inputs.web_artifact }}", path: shellsrc/mobile/shell/www }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: prepare + sync
        working-directory: shellsrc/mobile/shell
        run: |
          npm ci
          node scripts/prepare.mjs ../../../game/game.json
          npx cap add ios || true
          npx cap sync ios
      - name: setup ruby + fastlane
        uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.2', bundler-cache: true, working-directory: shellsrc/mobile/shell }
      - name: fastlane → App Store / TestFlight (${{ inputs.track }})
        working-directory: shellsrc/mobile/shell
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          bundle exec fastlane ios "$( [ '${{ inputs.track }}' = 'release' ] && echo release || echo beta )"

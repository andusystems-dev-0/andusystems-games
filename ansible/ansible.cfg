[defaults]
inventory = inventory/games/hosts.yml
host_key_checking = False
retry_files_enabled = False
# stdout_callback = yaml   # needs the community.general collection (not installed on the
# runner, which only pip-installs ansible-core) -> "Could not load 'yaml' callback plugin".
# The built-in default callback needs no collections; re-enable only if we install collections.

[ssh_connection]
# A redeploy recreates VMs with new host keys at the same IPs (pterodactyl gotcha #2).
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ControlMaster=auto -o ControlPersist=60s
